<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f2">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <title>宝可梦全景卡工坊</title>
  <script type="module" src="./main.mjs"></script>
</head>
<body>
<header class="mast">
  <a class="brand" href="./" aria-label="全景卡工坊首页"><i aria-hidden="true"></i>全景卡工坊</a>
  <a class="jump" href="#studio">制作卡牌 <span aria-hidden="true">↓</span></a>
</header>
<main>
  <section class="hero" aria-labelledby="hero-title">
    <div>
      <h1 id="hero-title">把宝可梦平卡<br><em>延展成全景卡。</em></h1>
      <p>上传原卡，让插画里的场景一路延伸到卡面边缘。可以保留经典卡框，也可以让画面铺满整张卡。</p>
    </div>
    <figure class="example">
      <div class="pair">
        <div><img src="./examples/ponyta-original.jpg" alt="小火马原卡，中央插画外围有文字区与黄色边框" width="337" height="470"><span>原卡</span></div>
        <div><a href="./examples/ponyta-generated.png" target="_blank" rel="noreferrer"><img src="./examples/ponyta-preview.jpg" alt="查看小火马实测成图，山脉和雪坡延展到卡面底部" width="337" height="470"></a><span>实测全景卡</span></div>
      </div>
      <figcaption><a href="https://pkmncards.com/card/ponyta-generations-gen-14/" target="_blank" rel="noreferrer">小火马 · Generations 14 ↗</a></figcaption>
    </figure>
  </section>
  <form id="studio">
    <div class="columns">
      <section class="column">
        <div class="field-head"><label for="source">原卡图</label><button type="button" class="linklike" id="try-sample">用小火马试做 ↗</button></div>
        <div id="upload-area">
          <input type="file" id="source" accept="image/jpeg,image/png,image/webp">
          <label class="drop" for="source">
            <span class="upload-icon" aria-hidden="true">↑</span>
            <strong>上传一张卡图或实拍照</strong>
            <small>也可拖入图片 · JPG / PNG / WebP · 最高 8 MB</small>
          </label>
          <div class="attachment" id="attachment" hidden>
            <img id="input-preview" alt="所选原卡">
            <div class="attachment-bar"><span id="filename"></span><button type="button" class="linklike" id="remove-source">移除</button></div>
          </div>
        </div>
        <details id="region-editor" hidden>
          <summary>校准原插画范围</summary>
          <p>框内的原画会保留。拖动四角微调，或从插画一角拖到对角重新框选。</p>
          <div class="region-stage">
            <img alt="待校准的原卡" draggable="false">
            <div class="region-box">
              <button type="button" data-corner="nw" aria-label="移动插画左上角，可用方向键微调"></button>
              <button type="button" data-corner="ne" aria-label="移动插画右上角，可用方向键微调"></button>
              <button type="button" data-corner="sw" aria-label="移动插画左下角，可用方向键微调"></button>
              <button type="button" data-corner="se" aria-label="移动插画右下角，可用方向键微调"></button>
            </div>
          </div>
          <button type="button" class="linklike region-reset">恢复初始范围</button>
        </details>
      </section>
      <div class="column settings">
        <fieldset id="borders">
          <legend>成卡边框</legend>
          <div class="choices">
            <label><input type="radio" name="border" value="gray" checked><span class="edge gray" aria-hidden="true"></span>灰黑框</label>
            <label><input type="radio" name="border" value="theme"><span class="edge theme" aria-hidden="true"></span>主题色框</label>
            <label><input type="radio" name="border" value="none"><span class="edge none" aria-hidden="true"></span>无框</label>
          </div>
        </fieldset>
        <div class="brief"><label for="brief">画面要求 <span>选填</span></label><textarea id="brief" rows="3" maxlength="1000" placeholder="例如：向下续画原图中的雪坡，保持原画的笔触和光线。"></textarea></div>
      </div>
    </div>
    <div class="key-row">
      <div class="engine-col"><fieldset id="engines"><legend>生图服务</legend>
        <div class="engine-choices">
          <label><input type="radio" name="engine" value="public" checked>在线试做</label>
          <label><input type="radio" name="engine" value="ark">火山方舟（自带 Key）</label>
        </div>
      </fieldset>
      <p id="public-info" class="service-info">浏览器会将含所选原插画的构图底图、扩图蒙版和画面要求发给 Hugging Face 上的 FLUX.1 Fill [dev]。此公开体验仅供非商业试做，共享额度可能需要排队。</p>
      <div class="key-field" id="key-field" hidden><label for="api-key">火山方舟 API Key</label><input type="password" id="api-key" name="api-key" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="输入你的方舟 API Key" aria-describedby="key-info">
        <small id="key-info">密钥仅在当前页面使用，请求直接发给火山方舟。生图消耗你的方舟额度。</small>
      </div></div>
      <button class="primary" id="generate" type="submit">生成预览 <span aria-hidden="true">↗</span></button>
    </div>
    <div class="feedback">
      <p id="status" role="status" aria-live="polite"></p>
      <button type="button" class="linklike" id="cancel" hidden>停止等待</button>
    </div>
  </form>
  <section class="output" id="output" aria-labelledby="result-title" hidden>
    <div class="result-head"><h2 id="result-title" tabindex="-1">你的全景卡预览</h2><a id="download" class="primary" download>保存图片 <span aria-hidden="true">↓</span></a></div>
    <div class="result-mat"><img id="result" alt="本次生成的宝可梦全景卡"></div>
  </section>
  <noscript>请开启浏览器 JavaScript 后上传原卡并生成图片。</noscript>
</main>
</body>
</html>
